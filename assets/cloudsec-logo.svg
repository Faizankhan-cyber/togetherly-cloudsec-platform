<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
<title id="title">Togetherly CloudSec Platform</title>
<desc id="desc">Minimal geometric blue and violet cloud security mark beside the Togetherly CloudSec Platform wordmark.</desc>
<defs>
  <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29b6f6"/><stop offset="1" stop-color="#3976d8"/></linearGradient>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6478ed"/><stop offset="1" stop-color="#9b59d0"/></linearGradient>
</defs>
<rect width="1000" height="220" rx="20" fill="#0d1424"/>
<!-- Simple folded geometric mark: three clean facets forming an abstract shield/cloud monogram -->
<g transform="translate(58 34)">
  <path d="M0 35 63 0 126 35 126 112 63 148 0 112Z" fill="none" stroke="#263d65" stroke-width="8" stroke-linejoin="round"/>
  <path d="M8 39 63 8 63 72 8 103Z" fill="url(#a)"/>
  <path d="M71 8 118 35 118 103 71 76Z" fill="url(#b)"/>
  <path d="M8 112 63 81 118 112 63 143Z" fill="#4d70d8"/>
  <path d="M63 8 71 12 71 76 63 72Z" fill="#a8dfff" opacity=".8"/>
</g>
<text x="235" y="103" fill="#f5f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="700">Togetherly</text>
<text x="238" y="157" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="600"><tspan fill="#6bbcff">CloudSec</tspan><tspan fill="#f5f7ff"> Platform</tspan></text>
<text x="240" y="188" fill="#8e9bb6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="3.2">CLOUD SECURITY ENGINEERING</text>
</svg>